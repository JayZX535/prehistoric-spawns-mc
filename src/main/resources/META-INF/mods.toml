#credits=""
authors="JayZX535"
displayTest="IGNORE_SERVER_VERSION"
description='''A mod that allows the dinosaurs from Fossils & Archeology: Revival to spawn naturally in the overworld.  Fully compatible with modded biomes!

Dinosaurs and other prehistoric creatures are added by Fossils & Archeology: Revival and are NOT from this mod!  All that Prehistoric Spawns does is allow them to spawn configurably in the world.  If you encounter an issue with natural spawning, please refer to the Prehistoric Spawns issue tracker, NOT F&A's!'''
